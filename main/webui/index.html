<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>esp32-kvm-ip mruby script</title>
<style>
  body { font-family: sans-serif; margin: 1.5em; max-width: 900px; }
  textarea { width: 100%; height: 60vh; font-family: monospace; font-size: 13px; box-sizing: border-box; }
  #status { white-space: pre-wrap; font-family: monospace; font-size: 12px; color: #555; margin: 0.5em 0; }
  #msg { margin: 0.5em 0; font-weight: bold; }
  button { font-size: 14px; padding: 0.4em 1.2em; }
  .hint { color: #888; font-size: 12px; }
</style>
</head>
<body>
<h2>esp32-kvm-ip mruby script</h2>
<div id="status">loading status...</div>
<textarea id="script" spellcheck="false" disabled>loading...</textarea>
<p>
  <button id="save" disabled>Save &amp; reboot</button>
  <span id="msg"></span>
</p>
<p class="hint">
  Saving writes the mrb_script partition and reboots the board to apply
  it - same effect as bin/upload_mruby_script.py, but over WiFi instead
  of serial. The board is unreachable for a few seconds while it
  restarts; refresh this page once it's back.
</p>
<script>
const scriptEl = document.getElementById('script');
const statusEl = document.getElementById('status');
const saveBtn = document.getElementById('save');
const msgEl = document.getElementById('msg');

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    statusEl.textContent = await res.text();
  } catch (e) {
    statusEl.textContent = 'status unavailable: ' + e;
  }
}

async function loadScript() {
  try {
    const res = await fetch('/api/script');
    scriptEl.value = await res.text();
    scriptEl.disabled = false;
    saveBtn.disabled = false;
  } catch (e) {
    msgEl.textContent = 'failed to load script: ' + e;
  }
}

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  msgEl.textContent = 'saving...';
  try {
    const res = await fetch('/api/script', { method: 'POST', body: scriptEl.value });
    const text = await res.text();
    if (res.ok) {
      msgEl.textContent = text.trim() + ' Refresh this page in a few seconds.';
    } else {
      msgEl.textContent = 'error: ' + text;
      saveBtn.disabled = false;
    }
  } catch (e) {
    msgEl.textContent = 'saved - board is rebooting (connection drop here is expected).';
  }
};

loadStatus();
loadScript();
</script>
</body>
</html>
